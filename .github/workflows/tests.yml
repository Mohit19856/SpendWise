name: SpendWise CI

# When should this workflow run?
#   * on every push to main / master / any feature branch
#   * on every pull request that targets main / master
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

# A new push to the same branch cancels the previous, still-running pipeline.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    # NOTE: no AWS credentials and no secrets are needed here.
    # The test suite uses its own temporary SQLite database.
    env:
      FLASK_CONFIG: testing

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Show the Python version
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check that the application imports
        run: python -c "from app import create_app; create_app('testing'); print('import OK')"

      - name: Run the test suite with pytest
        run: pytest -v --tb=short

      - name: Upload the test report when a step fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-failure-logs-${{ matrix.python-version }}
          path: |
            .pytest_cache/
          if-no-files-found: ignore
          retention-days: 5
