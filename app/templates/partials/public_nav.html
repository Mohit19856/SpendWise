{# Public navigation bar (landing, login, register pages). #}
<nav class="navbar navbar-expand-lg public-navbar sticky-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('index') }}">
      <span class="brand-logo"><i class="bi bi-wallet2"></i></span>
      <span>
        <strong>{{ APP_NAME }}</strong>
        <small class="d-block text-muted" style="font-size:.7rem;line-height:1;">{{ APP_TAGLINE }}</small>
      </span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#publicNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="publicNav">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
        {% if current_user.is_authenticated %}
          <li class="nav-item"><a class="nav-link" href="{{ url_for('dashboard.home') }}">Dashboard</a></li>
          <li class="nav-item"><a class="btn btn-brand btn-sm px-3" href="{{ url_for('dashboard.home') }}">Open SpendWise</a></li>
        {% else %}
          <li class="nav-item"><a class="nav-link" href="{{ url_for('auth.login') }}">Login</a></li>
          <li class="nav-item"><a class="btn btn-brand btn-sm px-3" href="{{ url_for('auth.register') }}">Get Started</a></li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
